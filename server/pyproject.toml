[project]
name = "stackchan-local"
version = "0.1.0"
description = "Local-first realtime bilingual agent server for custom Stack-chan firmware"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.2,<3",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httptools>=0.6,<1",
  "python-dotenv>=1,<2",
  "uvicorn>=0.34,<1",
  "uvloop>=0.21,<1",
  "websockets>=15,<17",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
stackchan = "stackchan_agent.launcher:main"
stackchan-server = "stackchan_agent.app:main"
stackchan-bench = "stackchan_agent.bench:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stackchan_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
